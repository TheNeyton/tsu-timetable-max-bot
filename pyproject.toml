[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsu-timetable-max-bot"
version = "0.1.0"
description = "MAX bot for the Tomsk State University timetable"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2,<1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<0.29",
    "maxapi==1.2.4",
    "pydantic>=2.12,<3",
    "PyMySQL[rsa]>=1.1,<2",
    "python-dotenv>=1.2,<2",
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
tsu-max-bot = "tsu_max_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
